<header class="topbar">
  <span class="brand">MORTAL ASCENT</span>
  <nav class="tabsnav" aria-label="Main">
    <a href="/profile"{% if page == "profile" %} class="on" aria-current="page"{% endif %}>Profile</a>
    <a href="/inventory"{% if page == "inventory" %} class="on" aria-current="page"{% endif %}>Inventory</a>
    <a href="/forge"{% if page == "forge" %} class="on" aria-current="page"{% endif %}>Forge</a>
    <a href="/alchemy"{% if page == "alchemy" %} class="on" aria-current="page"{% endif %}>Alchemy</a>
    <a href="/gather"{% if page == "gather" %} class="on" aria-current="page"{% endif %}>Gather</a>
  </nav>
  <div class="purse">
    <span class="chip coins" title="Lotus Coins">{{ coins }} Lotus</span>
    <span class="chip pearls" title="Moon Pearls">{{ pearls }} Pearls</span>
    {% if avatar %}<img class="avatar" src="{{ avatar }}" alt="{{ user.username }}" width="40" height="40">{% endif %}
    <form method="post" action="/logout"><button class="link" type="submit">Log out</button></form>
  </div>
</header>
